name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff format
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest -q